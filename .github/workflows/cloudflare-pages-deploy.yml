name: Cloudflare Pages deploy

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "Public URL to smoke-check after deployment"
        required: false
        default: "https://lamezia-trasparente.pages.dev"
        type: string
      project_name:
        description: "Cloudflare Pages project name"
        required: false
        default: "lamezia-trasparente"
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-pages-deploy.yml'
      - 'artifacts/api-server/src/routes/organi.ts'
      - 'artifacts/api-server/src/routes/organi.test.ts'
      - 'artifacts/lamezia-trasparente/**'
      - 'data/public/albo/**'
      - 'data/processed/territorio/**'
      - 'data/sources/organi-istituzionali-*.json'
      - 'lib/db/src/institutional-officials*.ts'
      - 'lib/db/src/organi-sync.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/check-institutional-*.ts'
      - 'scripts/check-public-contracts-page.mjs'
      - 'scripts/check-v0-static-fallback.mjs'
      - 'wrangler.toml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy and smoke Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SITE_URL: ${{ inputs.public_url || vars.PUBLIC_SITE_URL || 'https://lamezia-trasparente.pages.dev' }}
      CLOUDFLARE_PROJECT_NAME: ${{ inputs.project_name || vars.CLOUDFLARE_PROJECT_NAME || 'lamezia-trasparente' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static frontend
        env:
          BASE_PATH: /
          CI: "true"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm --filter @workspace/lamezia-trasparente run build

      - name: Check deploy provenance artifact
        shell: bash
        run: |
          test -f artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq 'contracts-current-albo-static-v3' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq 'colazeta/Lamezia-Trasparente-Monitor' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq '"commitSha": "${{ github.sha }}"' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq '/organi' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json

      - name: Smoke generated static fallback
        run: node scripts/check-v0-static-fallback.mjs

      - name: Resolve Cloudflare deployment mode
        id: cloudflare_mode
        shell: bash
        run: |
          token_present=false
          account_present=false

          if [ -n "$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" ]; then
            token_present=true
            echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          fi

          if [ -n "$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" ]; then
            account_present=true
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          fi

          if [ "$token_present" = true ] && [ "$account_present" = true ]; then
            echo "direct=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages deployment mode"
              echo ""
              echo "Wrangler direct publish is enabled. The public smoke will require the exact Git commit after deployment."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$token_present" = false ] && [ "$account_present" = false ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "direct=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages deployment mode"
              echo ""
              echo "Wrangler credentials are not configured, so publishing is delegated to the existing Cloudflare Pages Git integration. The public smoke will wait for and require this exact Git commit."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$token_present" = false ] && [ "$account_present" = false ]; then
            echo "::error::A manual deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID because no Git push is available to trigger the native Cloudflare Pages integration."
            exit 1
          else
            echo "::error::Cloudflare credentials are only partially configured. Set both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; removing both selects the native Git integration only on push events."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare_mode.outputs.direct == 'true'
        run: |
          pnpm dlx wrangler@latest pages deploy artifacts/lamezia-trasparente/dist/public \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch main

      - name: Smoke public contracts and organi routes
        run: node scripts/check-public-contracts-page.mjs --url "$PUBLIC_SITE_URL" --expected-commit "$GITHUB_SHA" --attempts 24 --delay-ms 10000
