name: WhisperX real benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/whisperx-real-benchmark.yml'
      - 'tools/whisperx/**'
      - 'docs/architecture/whisperx-integration.md'

permissions:
  contents: read

concurrency:
  group: whisperx-real-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: CPU/int8 municipal-session benchmark (metrics only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCHMARK_ID: sondrio-consiglio-2026-04-30-official-control-clip
      SOURCE_ROLE: official-municipal-control
      CANONICAL_STATUS: official-source
      SOURCE_PROVIDER: comune-sondrio
      SOURCE_ID: seduta-consiglio-2026-04-30-audio
      SOURCE_URL: https://comune.sondrio.it/wp-content/uploads/sites/152/2026/05/30_04_2026_Compresso_tagl.mp3
      CLIP_START_SECONDS: '300'
      CLIP_DURATION_SECONDS: '600'
      WHISPERX_MODEL: small

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify media tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version > /tmp/ffmpeg-version.txt
          ffprobe -version > /tmp/ffprobe-version.txt
          head -n 1 /tmp/ffmpeg-version.txt
          head -n 1 /tmp/ffprobe-version.txt

      - name: Test benchmark minimisation helper
        run: |
          python tools/whisperx/test_benchmark_metrics.py
          python -m py_compile tools/whisperx/benchmark_metrics.py tools/whisperx/extract_media.py

      - name: Acquire official control audio and derive bounded local clip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/whisperx-benchmark/source tmp/whisperx-benchmark/output
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --output tmp/whisperx-benchmark/source/source.mp3 \
            "$SOURCE_URL"
          test -s tmp/whisperx-benchmark/source/source.mp3

          ffmpeg -hide_banner -loglevel error -y \
            -ss "$CLIP_START_SECONDS" \
            -t "$CLIP_DURATION_SECONDS" \
            -i tmp/whisperx-benchmark/source/source.mp3 \
            -vn -ac 1 -ar 16000 -c:a pcm_s16le \
            tmp/whisperx-benchmark/benchmark.wav
          test -s tmp/whisperx-benchmark/benchmark.wav
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 tmp/whisperx-benchmark/benchmark.wav)"
          python - "$duration" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 590 <= duration <= 601:
              raise SystemExit(f'unexpected benchmark clip duration: {duration}')
          PY
          rm -rf tmp/whisperx-benchmark/source

      - name: Install WhisperX CPU-only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv pip install --system --torch-backend=cpu -r tools/whisperx/requirements.txt
          python - <<'PY'
          import importlib.metadata
          import torch
          assert torch.version.cuda is None, f'CUDA build unexpectedly installed: {torch.version.cuda}'
          assert importlib.metadata.version('whisperx') == '3.8.6'
          print('WhisperX CPU-only preflight: OK')
          PY

      - name: Run ASR and word alignment
        shell: bash
        run: |
          set -euo pipefail
          python tools/whisperx/extract_media.py \
            tmp/whisperx-benchmark/benchmark.wav \
            --model "$WHISPERX_MODEL" \
            --batch-size 4 \
            --max-bytes 25000000 \
            --max-duration-seconds 660 \
            --output-dir tmp/whisperx-benchmark/output \
            > tmp/whisperx-benchmark/extractor-result.json

      - name: Produce metrics-only result
        shell: bash
        run: |
          set -euo pipefail
          transcript="$(find tmp/whisperx-benchmark/output -maxdepth 1 -type f -name '*.whisperx.json' | head -n 1)"
          manifest="$(find tmp/whisperx-benchmark/output -maxdepth 1 -type f -name '*.whisperx.manifest.json' | head -n 1)"
          test -n "$transcript"
          test -n "$manifest"
          python tools/whisperx/benchmark_metrics.py \
            --transcript "$transcript" \
            --manifest "$manifest" \
            --output tmp/whisperx-benchmark/metrics.json \
            --benchmark-id "$BENCHMARK_ID" \
            --source-role "$SOURCE_ROLE" \
            --canonical-status "$CANONICAL_STATUS" \
            --source-provider "$SOURCE_PROVIDER" \
            --source-id "$SOURCE_ID" \
            --clip-start-seconds "$CLIP_START_SECONDS" \
            --clip-requested-seconds "$CLIP_DURATION_SECONDS"

      - name: Enforce metrics-only retention
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/whisperx-benchmark/benchmark.wav
          rm -rf tmp/whisperx-benchmark/output
          rm -f tmp/whisperx-benchmark/extractor-result.json
          test -f tmp/whisperx-benchmark/metrics.json
          if find tmp/whisperx-benchmark -type f \( -name '*.wav' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.webm' -o -name '*.mp4' -o -name '*.whisperx.json' \) | grep -q .; then
            echo 'WhisperX benchmark retained media/transcript content' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tmp/whisperx-benchmark/metrics.json')
          data = json.loads(p.read_text())
          assert data['privacy']['transcriptRetained'] is False
          assert data['privacy']['rawMediaRetained'] is False
          assert data['privacy']['speakerIdentityProduced'] is False
          assert data['processor']['diarizationEnabled'] is False
          assert data['canonicalStatus'] == 'official-source'
          assert data['source']['provider'] == 'comune-sondrio'
          print(json.dumps(data, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload metrics-only benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisperx-benchmark-metrics
          path: tmp/whisperx-benchmark/metrics.json
          if-no-files-found: error
          retention-days: 7
