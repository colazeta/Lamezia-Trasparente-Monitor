name: v0 static fallback smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-static-fallback:
    name: Build and smoke v0 static fallback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check public smoke script syntax
        run: node --check scripts/check-public-contracts-page.mjs

      - name: Build static fallback
        run: pnpm --filter @workspace/lamezia-trasparente run build

      - name: Check deploy provenance artifact
        shell: bash
        run: |
          test -f artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq 'contracts-anac-bdncp-resilient-v4' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq 'colazeta/Lamezia-Trasparente-Monitor' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq '"commitSha": "${{ github.sha }}"' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json
          grep -Fq '/organi' artifacts/lamezia-trasparente/dist/public/deploy-provenance.json

      - name: Smoke static fallback
        run: pnpm run smoke:v0-static-fallback

      - name: Upload static fallback artifact
        uses: actions/upload-artifact@v4
        with:
          name: v0-static-fallback-public
          path: artifacts/lamezia-trasparente/dist/public
          if-no-files-found: error
          retention-days: 7
