name: Lamezia PNRR static feed refresh

on:
  workflow_dispatch:
  schedule:
    # The municipal source has no webhook: poll away from the top of the hour.
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "scripts/build-lamezia-pnrr-static-data.mjs"
      - "scripts/check-lamezia-pnrr-static-data.mjs"
      - "scripts/pnrr/**"
      - "artifacts/lamezia-trasparente/src/data/lameziaPnrr*"
      - "artifacts/lamezia-trasparente/src/pages/Pnrr.tsx"
      - ".github/workflows/lamezia-pnrr-static-data.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-lamezia-pnrr-static-data.mjs"
      - "scripts/check-lamezia-pnrr-static-data.mjs"
      - "scripts/pnrr/**"
      - ".github/workflows/lamezia-pnrr-static-data.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: lamezia-pnrr-static-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-pnrr-feed:
    name: Validate and refresh municipal/OpenCUP PNRR feed
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fast-forward branch before scheduled write
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: git pull --ff-only origin main

      - name: Test parser, safety policy and CUP reconciliation
        run: |
          node --check scripts/pnrr/lameziaPnrrCore.mjs
          node --check scripts/build-lamezia-pnrr-static-data.mjs
          node --check scripts/check-lamezia-pnrr-static-data.mjs
          node --test scripts/pnrr/lameziaPnrrCore.test.mjs
          node scripts/build-lamezia-pnrr-static-data.mjs --reconcile-local
          node scripts/check-lamezia-pnrr-static-data.mjs

      - name: Detect new CUPs and materialize municipal/OpenCUP project pages
        if: github.event_name != 'pull_request'
        run: node scripts/build-lamezia-pnrr-static-data.mjs

      - name: Commit changed static feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/submit-data-refresh-pr.sh pnrr
          "Update Lamezia PNRR static feed"
          artifacts/lamezia-trasparente/src/data/generated/lameziaPnrrProjects.json
