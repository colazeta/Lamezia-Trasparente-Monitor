name: Municipal demographic integration

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/db/**"
      - ".github/workflows/municipal-demographics-integration.yml"
      - "artifacts/lamezia-trasparente/src/data/generated/lameziaDemographicTrend.json"
      - "artifacts/lamezia-trasparente/src/data/generated/lameziaForeignResidentsAgeSex.json"
      - "artifacts/lamezia-trasparente/src/data/generated/lameziaFamiliesChildren.json"
  push:
    branches: [main, codex/771-canonical-demographic-backfill]
    paths:
      - "lib/db/**"
      - ".github/workflows/municipal-demographics-integration.yml"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: municipal_demographic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d municipal_demographic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db run test
      - name: Backfill, rerun and rollback against isolated PostgreSQL
        run: pnpm --filter @workspace/db exec tsx src/municipalDemographicIntegration.ts
        env:
          MUNICIPAL_DEMOGRAPHIC_TEST_URL: postgresql://test:disposable-test-only@127.0.0.1:5432/municipal_demographic_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: municipal-demographic-integration
          path: reports/municipal-demographic-integration/
          if-no-files-found: warn
          retention-days: 14
