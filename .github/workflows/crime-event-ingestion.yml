name: Crime event canonical ingestion

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/legalita/ltceds/monitor/**"
      - "data/legalita/ltceds/monitor-event-1.0.schema.json"
      - "lib/db/src/crimeMonitorIngestion*.ts"
      - "lib/db/package.json"
      - ".github/workflows/crime-event-ingestion.yml"
  push:
    branches:
      - main
    paths:
      - "data/legalita/ltceds/monitor/**"
      - "data/legalita/ltceds/monitor-event-1.0.schema.json"
      - "lib/db/src/crimeMonitorIngestion*.ts"
      - "lib/db/package.json"
      - ".github/workflows/crime-event-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate monitored crime artifacts
        run: pnpm --filter @workspace/db run import:crime-monitor --input data/legalita/ltceds/monitor

      - name: Run crime persistence tests
        run: pnpm --filter @workspace/db test

      - name: Persist canonical crime events
        if: github.event_name != 'pull_request' && env.DATABASE_URL != ''
        run: pnpm --filter @workspace/db run import:crime-monitor --input data/legalita/ltceds/monitor --execute

      - name: Report missing database secret
        if: github.event_name != 'pull_request' && env.DATABASE_URL == ''
        run: |
          echo "DATABASE_URL is not configured for this workflow; validation passed but canonical DB ingestion was skipped." >> "$GITHUB_STEP_SUMMARY"
