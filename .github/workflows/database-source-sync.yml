name: Verify registered civic snapshots on Render

on:
  workflow_dispatch:
  schedule:
    - cron: "35 20 * * *"
  push:
    branches: [main]
    paths:
      - "data/public/albo/latest.json"
      - "data/public/albo/delibere-archive.json"
      - "data/public/contracts/anac-bdncp/latest.json"
      - "data/public/contracts/anac-authority/latest.json"
      - "artifacts/lamezia-trasparente/src/data/generated/lameziaPnrrProjects.json"
      - "lib/db/src/sourceSnapshot*.ts"
      - "lib/db/src/canonicalPublicSnapshot*.ts"
      - "lib/publication-standardisation/src/canonical-public.ts"
      - "artifacts/api-server/src/routes/public.ts"
      - "artifacts/api-server/src/lib/sourceSnapshot*.ts"
      - "artifacts/api-server/src/routes/operationalHealth.ts"
      - "scripts/check-database-source-sync.mjs"
      - "scripts/lib/sourceSnapshotVerification.mjs"
      - "scripts/check-civic-public-snapshot.mjs"
      - "scripts/refresh-civic-public-snapshot.mjs"
      - "scripts/build-civic-public-support.mjs"
      - ".github/workflows/database-source-sync.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: database-source-sync
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the expected committed snapshot plan without a database connection
        run: pnpm --filter @workspace/db run import:source-snapshots --output /tmp/source-import-plan.json
      - name: Wait for Render and verify its completed reconciliation
        run: node scripts/check-database-source-sync.mjs --plan /tmp/source-import-plan.json --output /tmp/source-sync-verification.json
      - name: Export the verified canonical public edition from Render
        run: node scripts/refresh-civic-public-snapshot.mjs
      - name: Regenerate the data architecture inventory
        run: |
          node scripts/build-civic-public-support.mjs
          pnpm run architecture:inventory
      - name: Propose the public edition through protected-main checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash scripts/submit-data-refresh-pr.sh civic
          "Update canonical Albo and PNRR public edition"
          data/public/canonical/civic-snapshot.json
          artifacts/lamezia-trasparente/src/data/generated/canonicalAlboSupport.json
          architecture/current-data-inventory.json
      - name: Retain the plan and remote verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-sync-verification
          path: |
            /tmp/source-import-plan.json
            /tmp/source-sync-verification.json
          if-no-files-found: warn
          retention-days: 30
