name: ANAC operator live audit

on:
  push:
    branches:
      - codex/902-anac-operator-snapshot
    paths:
      - ".github/workflows/anac-operator-audit.yml"
      - "scripts/contracts/anacOperatorCoverageAudit.ts"
      - "scripts/contracts/anacOperators.ts"
      - "scripts/contracts/anacOperatorsStreaming.ts"
      - "scripts/contracts/anacOperatorSource.ts"
      - "scripts/contracts/syncOfficialAnacOperators.ts"
      - "data/public/contracts/anac-bdncp/latest.json"

permissions:
  contents: read

concurrency:
  group: anac-operator-audit-902
  cancel-in-progress: false

jobs:
  audit:
    name: Acquire ANAC participants and awardees
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync ANAC operator datasets
        id: sync
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm contracts:anac-operators-sync 2>&1 | tee .anac-operator-sync.log

      - name: Build coverage audit
        if: always()
        run: pnpm --filter @workspace/scripts exec tsx ./contracts/anacOperatorCoverageAudit.ts .artifacts/anac-operator-audit/coverage.json

      - name: Copy materialized snapshots into audit artifact
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/anac-operator-audit/snapshots
          cp -f .anac-operator-sync.log .artifacts/anac-operator-audit/sync.log || true
          cp -f data/public/contracts/anac-participants/latest.json .artifacts/anac-operator-audit/snapshots/participants.json 2>/dev/null || true
          cp -f data/public/contracts/anac-awardees/latest.json .artifacts/anac-operator-audit/snapshots/awardees.json 2>/dev/null || true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anac-operator-audit-902
          path: .artifacts/anac-operator-audit
          if-no-files-found: error
          retention-days: 14

      - name: Fail if live sync was incomplete
        if: steps.sync.outcome != 'success'
        run: exit 1
