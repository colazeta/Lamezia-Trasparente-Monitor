name: Materialise reviewed consolidation patch
on:
  push:
    branches: [codex/771-demographic-consumer-convergence]
    paths:
      - .github/workflows/consolidation-materialise.yml
      - .consolidation-transfer/**
permissions:
  contents: write
jobs:
  materialise:
    if: github.repository == 'colazeta/Lamezia-Trasparente-Monitor' && github.ref == 'refs/heads/codex/771-demographic-consumer-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply exact locally reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f91fd098de13c0f8f6f64cf6709bff718ee509ca
          cat .consolidation-transfer/part-0.xz .consolidation-transfer/part-1.xz .consolidation-transfer/part-2.xz > "$RUNNER_TEMP/reviewed.patch.xz"
          echo "5fbcf39fefc51e107b65f60b4e44bb74f641077127ed507c9b3af2714a985733  $RUNNER_TEMP/reviewed.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/reviewed.patch.xz" > "$RUNNER_TEMP/reviewed.patch"
          echo "72ac66afb2993355e3bf692349be128e6e581493c98db99a76245178310e47a7  $RUNNER_TEMP/reviewed.patch" | sha256sum -c -
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          if git diff --cached --name-only | grep -E '^\.github/|^\.consolidation-transfer/'; then
            echo 'Unexpected workflow or transfer change in source patch' >&2
            exit 1
          fi
          cp .git/index "$RUNNER_TEMP/verify.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/verify.index" git update-index --force-remove .consolidation-transfer/part-0.xz .consolidation-transfer/part-1.xz .consolidation-transfer/part-2.xz .github/workflows/consolidation-materialise.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/verify.index" git write-tree)" = 91cca8731889ef14dd97d19f3a16d6701cc26a0a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: converge municipal demographic consumers and evidence ledger (#771)'
          git push origin HEAD:refs/heads/codex/771-demographic-consumer-convergence
          mkdir -p "$RUNNER_TEMP/materialisation-receipt"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/materialisation-receipt/commit.txt"
          printf '%s\n' '91cca8731889ef14dd97d19f3a16d6701cc26a0a' > "$RUNNER_TEMP/materialisation-receipt/reviewed-source-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: consolidation-materialisation-receipt
          path: ${{ runner.temp }}/materialisation-receipt/
          retention-days: 14
